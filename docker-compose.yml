services:
  redis:
    image: redis:7-alpine
    container_name: aegis_ai_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  ai-engine:
    build:
      context: ./ai-engine
    container_name: aegis_ai_engine
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "${AI_ENGINE_PORT:-8000}:8000"
    depends_on:
      - redis
    restart: unless-stopped
