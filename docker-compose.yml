services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aegis_ai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aegis_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
